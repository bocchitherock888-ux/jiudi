<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#BA4735">
<title>就地</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <a class="skip-link" href="#mainContent">跳到主要内容</a>
  <nav class="shell-nav" aria-label="主要导航">
    <a class="brand" href="index.html"><img src="favicon.png" width="24" height="24" alt="">就地</a>
    <div class="nav-links">
      <a href="image.html">图片</a>
      <a href="pdf.html">PDF</a>
      <a href="video.html">视频</a>
    </div>
  </nav>
  <main id="mainContent" class="hub-page">
    <header class="hub-hero">
      <img class="hub-mark" src="favicon.png" width="72" height="72" alt="">
      <h1>图片、PDF、视频处理</h1>
      <p class="hero-copy">在本机处理，结果另存。</p>
    </header>
    <section class="hub-tools">
      <a class="hub-tool" href="image.html">
        <div class="hub-preview is-image" aria-hidden="true">
          <span class="pv-photo"></span>
          <span class="pv-crop">
            <i class="nw"></i><i class="ne"></i><i class="sw"></i><i class="se"></i>
          </span>
        </div>
        <h2>图片 <span aria-hidden="true">↗</span></h2>
        <p>裁切、旋转，压到指定 KB</p>
      </a>
      <a class="hub-tool" href="pdf.html">
        <div class="hub-preview is-pdf" aria-hidden="true">
          <span class="pv-page a"></span>
          <span class="pv-page b"></span>
        </div>
        <h2>PDF <span aria-hidden="true">↗</span></h2>
        <p>选页、重排、合并、导出</p>
      </a>
      <a class="hub-tool" href="video.html">
        <div class="hub-preview is-video" aria-hidden="true">
          <span class="pv-screen"></span>
          <span class="pv-film"><i></i><i></i><i></i><i></i><i></i></span>
        </div>
        <h2>视频 <span aria-hidden="true">↗</span></h2>
        <p>时间线裁一段，压到目标体积</p>
      </a>
    </section>
  </main>
</div>
</body>
</html>
